<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek NOOM NOOM - กรีกโยเกิร์ตโฮมเมด เเบบนุ่มๆ DIY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5c3d2e;
            --primary-light: #8b5a42;
            --accent: #e0a96d;
            --accent-soft: #f4e8c1;
            --bg-base: #faf6f0;
            --bg-card: #ffffff;
            --text-dark: #2c221e;
            --text-muted: #7a6e67;
            --line-green: #06c755;
            --line-green-hover: #05b34c;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 30px rgba(92, 61, 46, 0.08);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 120px;
        }

        /* Header & Banner */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            text-align: center;
            padding: 40px 20px 30px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: var(--shadow);
        }

        header .logo-badge {
            background: var(--accent);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 4px 14px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .container {
            max-width: 900px;
            margin: -20px auto 0;
            padding: 0 20px;
        }

        /* Layout Grid */
        .builder-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .builder-grid {
                grid-template-columns: 1fr 340px;
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--bg-base);
            padding-bottom: 10px;
        }

        .card-title span.step {
            background: var(--accent-soft);
            color: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
        }

        /* Option Item Boxes */
        .option-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .option-item {
            position: relative;
        }

        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            background: var(--bg-base);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            height: 100%;
        }

        .option-label .icon {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .option-label .name {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .option-label .price {
            font-size: 0.85rem;
            color: var(--primary-light);
            font-weight: 600;
            margin-top: 2px;
        }

        /* Selection States */
        .option-item input:checked + .option-label {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(92, 61, 46, 0.15);
            transform: translateY(-2px);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2d9d0;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fcfbfa;
        }

        .form-control:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* Order Summary Sidebar */
        .summary-card {
            position: sticky;
            top: 20px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .summary-item .title {
            color: var(--text-muted);
        }

        .summary-item .val {
            font-weight: 500;
            text-align: right;
        }

        .summary-toppings-list {
            font-size: 0.85rem;
            color: var(--text-muted);
            padding-left: 12px;
            margin-top: 4px;
            margin-bottom: 10px;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 16px 0;
        }

        .total-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* LINE Order Button */
        .btn-line {
            width: 100%;
            background-color: var(--line-green);
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(6, 199, 85, 0.3);
        }

        .btn-line:hover {
            background-color: var(--line-green-hover);
            transform: translateY(-2px);
        }

        .btn-line:active {
            transform: translateY(0);
        }

        .btn-line svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        /* Mobile Bottom Bar Fix */
        @media (max-width: 767px) {
            .summary-card {
                position: relative;
                top: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <span class="logo-badge">Homemade & Fresh</span>
        <h1>Greek NOOM NOOM</h1>
        <p>กรีกโยเกิร์ตในสไตล์คุณ สด ใหม่ เข้มข้น อร่อยทุกคำ</p>
    </header>

    <div class="container">
        <div class="builder-grid">
            
            <!-- Main Form Step Section -->
            <div class="main-options">
                
                <!-- Step 1: Base Yogurt -->
                <div class="card">
                    <div class="card-title">
                        <span class="step">1</span> เลือกรสชาติกรีกโยเกิร์ต (Base)
                    </div>
                    <div class="option-group">
                        <div class="option-item">
                            <input type="radio" id="base-original" name="base" value="รสออริจินัล" data-price="59" checked onchange="calculateTotal()">
                            <label for="base-original" class="option-label">
                                <span class="icon">🥛</span>
                                <span class="name">ออริจินัล</span>
                                <span class="price">59 ฿</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Size -->
                <div class="card">
                    <div class="card-title">
                        <span class="step">2</span> เลือกขนาด (Size)
                    </div>
                    <div class="option-group">
                        <div class="option-item">
                            <input type="radio" id="size-s" name="size" value="Size S (100g)" data-price="0" checked onchange="calculateTotal()">
                            <label for="size-s" class="option-label">
                                <span class="icon">🥣</span>
                                <span class="name">1 scoop (100g)</span>
                                <span class="price">+40 ฿</span>
                            </label>
                        </div>
                        <div class="option-item">
                            <input type="radio" id="size-m" name="size" value="Size M (150g)" data-price="30" onchange="calculateTotal()">
                            <label for="size-m" class="option-label">
                                <span class="icon">🥣</span>
                                <span class="name">2 scoop (150g)</span>
                                <span class="price">+30 ฿</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Step 3: Toppings -->
                <div class="card">
                    <div class="card-title">
                        <span class="step">3</span> เลือกท็อปปิ้ง (Toppings)
                    </div>
                    <div class="option-group">
                        <div class="option-item">
                            <input type="checkbox" id="top-banana" name="topping" value="กล้วยหอม" data-price="10" onchange="calculateTotal()">
                            <label for="top-banana" class="option-label">
                                <span class="icon">🍌</span>
                                <span class="name">กล้วยหอม</span>
                                <span class="price">+10 ฿</span>
                            </label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="top-berry" name="topping" value="มิกซ์เบอร์รี" data-price="20" onchange="calculateTotal()">
                            <label for="top-berry" class="option-label">
                                <span class="icon">🫐</span>
                                <span class="name">มิกซ์เบอร์รี</span>
                                <span class="price">+20 ฿</span>
                            </label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="top-mango" name="topping" value="มะม่วงสุก" data-price="15" onchange="calculateTotal()">
                            <label for="top-mango" class="option-label">
                                <span class="icon">🥭</span>
                                <span class="name">มะม่วงสุก</span>
                                <span class="price">+15 ฿</span>
                            </label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="top-almond" name="topping" value="อัลมอนด์สไลซ์" data-price="15" onchange="calculateTotal()">
                            <label for="top-almond" class="option-label">
                                <span class="icon">🥜</span>
                                <span class="name">อัลมอนด์</span>
                                <span class="price">+15 ฿</span>
                            </label>
                        </div>
                        <div class="option-item">
                            <input type="checkbox" id="top-chia" name="topping" value="เมล็ดเจีย" data-price="10" onchange="calculateTotal()">
                            <label for="top-chia" class="option-label">
                                <span class="icon">🌱</span>
                                <span class="name">เมล็ดเจีย</span>
                                <span class="price">+10 ฿</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Step 4: Customer Details -->
                <div class="card">
                    <div class="card-title">
                        <span class="step">4</span> ข้อมูลการจัดส่ง
                    </div>
                    <div class="form-group">
                        <label for="cust-name">ชื่อผู้สั่งซื้อ *</label>
                        <input type="text" id="cust-name" class="form-control" placeholder="ระบุชื่อของคุณ" required>
                    </div>
                    <div class="form-group">
                        <label for="cust-phone">เบอร์โทรศัพท์ *</label>
                        <input type="tel" id="cust-phone" class="form-control" placeholder="08X-XXX-XXXX" required>
                    </div>
                    <div class="form-group">
                        <label for="cust-address">สถานที่จัดส่ง / หมายเหตุเพิ่มเติม</label>
                        <textarea id="cust-address" class="form-control" placeholder="ระบุที่อยู่จัดส่ง หรือรายละเอียดพิเศษ เช่น หวานน้อย"></textarea>
                    </div>
                </div>

            </div>

            <!-- Sidebar Summary Section -->
            <div class="sidebar">
                <div class="card summary-card">
                    <div class="card-title" style="border:none; margin-bottom:10px;">
                        สรุปรายการสั่งซื้อ
                    </div>
                    <div class="divider"></div>

                    <div class="summary-item">
                        <span class="title">เบสโยเกิร์ต:</span>
                        <span class="val" id="sum-base">รสออริจินัล</span>
                    </div>
                    <div class="summary-item">
                        <span class="title">ขนาด:</span>
                        <span class="val" id="sum-size">Size S (100g)</span>
                    </div>
                    <div class="summary-item">
                        <span class="title">ท็อปปิ้ง:</span>
                        <span class="val" id="sum-topping-count">0 รายการ</span>
                    </div>
                    <div class="summary-toppings-list" id="sum-toppings-detail">
                        - ไม่มีท็อปปิ้ง -
                    </div>

                    <div class="divider"></div>

                    <div class="total-price">
                        <span>ราคารวม</span>
                        <span id="sum-total">59 ฿</span>
                    </div>

                    <button type="button" class="btn-line" onclick="sendToLine()">
                        <svg viewBox="0 0 24 24">
                            <path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.036 9.608.391.084.922.258 1.057.592.121.303.079.778.039 1.085l-.171 1.027c-.053.303-.242 1.185 1.039.646 1.281-.54 6.911-4.069 9.428-6.967 1.739-1.907 2.572-3.844 2.572-6.001zm-16.2 2.256h-2.1v-4.5c0-.331-.269-.6-.6-.6s-.6.269-.6.6v5.1c0 .331.269.6.6.6h2.7c.331 0 .6-.269.6-.6s-.269-.6-.6-.6zm3.6 0h-1.2v-4.5c0-.331-.269-.6-.6-.6s-.6.269-.6.6v5.1c0 .331.269.6.6.6h1.8c.331 0 .6-.269.6-.6s-.269-.6-.6-.6zm2.7-2.1l-1.423-2.277c-.092-.147-.253-.235-.426-.235-.331 0-.6.269-.6.6v4.5c0 .331.269.6.6.6s.6-.269.6-.6v-2.223l1.423 2.277c.092.147.253.235.426.235.331 0 .6-.269.6-.6v-4.5c0-.331-.269-.6-.6-.6s-.6.269-.6.6v2.223zm4.5 2.1h-2.1v-4.5c0-.331-.269-.6-.6-.6s-.6.269-.6.6v5.1c0 .331.269.6.6.6h2.7c.331 0 .6-.269.6-.6s-.269-.6-.6-.6z"/>
                        </svg>
                        สั่งซื้อผ่าน LINE
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
    // กำหนด LINE ID ของร้าน
    const LINE_STORE_ID = "@raweechon"; 

    function calculateTotal() {
        // Base
        const baseElement = document.querySelector('input[name="base"]:checked');
        const baseName = baseElement ? baseElement.value : '';
        const basePrice = baseElement ? parseInt(baseElement.getAttribute('data-price')) : 0;

        // Size
        const sizeElement = document.querySelector('input[name="size"]:checked');
        const sizeName = sizeElement ? sizeElement.value : '';
        const sizePrice = sizeElement ? parseInt(sizeElement.getAttribute('data-price')) : 0;

        // Toppings
        const toppingElements = document.querySelectorAll('input[name="topping"]:checked');
        let toppingPriceSum = 0;
        let toppingNames = [];

        toppingElements.forEach(item => {
            toppingPriceSum += parseInt(item.getAttribute('data-price'));
            toppingNames.push(item.value);
        });

        // Calculate Grand Total
        const total = basePrice + sizePrice + toppingPriceSum;

        // Update UI Summary
        document.getElementById('sum-base').innerText = baseName + ` (${basePrice}฿)`;
        document.getElementById('sum-size').innerText = sizeName + (sizePrice > 0 ? ` (+${sizePrice}฿)` : '');
        document.getElementById('sum-topping-count').innerText = toppingNames.length + " รายการ";
        
        if (toppingNames.length > 0) {
            document.getElementById('sum-toppings-detail').innerText = "- " + toppingNames.join("\n- ");
        } else {
            document.getElementById('sum-toppings-detail').innerText = "- ไม่มีท็อปปิ้ง -";
        }

        document.getElementById('sum-total').innerText = total + " ฿";

        return {
            baseName,
            sizeName,
            toppingNames,
            total
        };
    }

    function sendToLine() {
        const name = document.getElementById('cust-name').value.trim();
        const phone = document.getElementById('cust-phone').value.trim();
        const address = document.getElementById('cust-address').value.trim();

        if (!name || !phone) {
            alert("กรุณากรอกชื่อและเบอร์โทรศัพท์ก่อนกดสั่งซื้อครับ");
            return;
        }

        const currentOrder = calculateTotal();

        // จัดข้อความสรุปออเดอร์
        let message = `🛒 *ออเดอร์ใหม่จากสั่งผ่านเว็บ*\n`;
        message += `------------------------------\n`;
        message += `🥣 *เบสโยเกิร์ต:* ${currentOrder.baseName}\n`;
        message += `📏 *ขนาด:* ${currentOrder.sizeName}\n`;
        
        if (currentOrder.toppingNames.length > 0) {
            message += `🍓 *ท็อปปิ้ง:*\n  • ` + currentOrder.toppingNames.join("\n  • ") + `\n`;
        } else {
            message += `🍓 *ท็อปปิ้ง:* ไม่ใส่ท็อปปิ้ง\n`;
        }

        message += `------------------------------\n`;
        message += `💰 *ราคารวม:* ${currentOrder.total} บาท\n`;
        message += `------------------------------\n`;
        message += `👤 *ชื่อลูกค้า:* ${name}\n`;
        message += `📞 *เบอร์โทร:* ${phone}\n`;
        if (address) {
            message += `📍 *ที่อยู่/หมายเหตุ:* ${address}\n`;
        }

        // Encode ข้อความสำหรับส่งผ่าน URL
        const encodedMessage = encodeURIComponent(message);
        
        // ลิงก์สำหรับส่งข้อความและระบุส่งถึง LINE OA: @raweechon
        const lineRedirectUrl = `https://line.me/R/oaMessage/${LINE_STORE_ID}/?${encodedMessage}`;

        // เปิดแอปพลิเคชัน LINE เพื่อส่งข้อความ
        window.open(lineRedirectUrl, '_blank');
    }

    // คำนวณราคาเริ่มต้นเมื่อโหลดหน้าเว็บ
    calculateTotal();
    </script>
</body>
</html>
